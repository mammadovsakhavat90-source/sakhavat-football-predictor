name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check server/index.js
          node --check server/prediction.js
      - name: Configure reliable Maven mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in Path("android").rglob("*.gradle"):
              source = file.read_text()
              if "maven.aliyun.com/repository/google" not in source:
                  source = source.replace(
                      "google()",
                      'google()\n        maven { url "https://maven.aliyun.com/repository/google" }\n        maven { url "https://maven.aliyun.com/repository/public" }'
                  )
                  file.write_text(source)
          PY
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakhavat-football-predictor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
